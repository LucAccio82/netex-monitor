name: Monitoraggio NeTEx

on:
  schedule:
    # 09:07 UTC = 10:07 ora italiana d'inverno, 11:07 con l'ora legale.
    # GitHub puo' avviare i workflow pianificati con qualche minuto di ritardo.
    - cron: "7 9 * * *"
  workflow_dispatch:
    inputs:
      opzioni:
        description: "Opzioni per check_netex.py (es. --dry-run oppure --force)"
        required: false
        default: ""

permissions:
  contents: write   # per salvare i risultati nel repository

concurrency:
  group: netex-monitor
  cancel-in-progress: false

jobs:
  controllo:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/netex-monitor.yml

      - name: Controllo snapshot NeTEx (livelli 1 e 2)
        id: check
        continue-on-error: true   # i risultati vengono salvati anche se il controllo segnala errori
        env:
          OPZIONI: ${{ inputs.opzioni }}
        run: python script/check_netex.py $OPZIONI

      - name: Report e grafici
        if: always()
        run: |
          pip install --quiet matplotlib
          python script/report.py

      - name: Limita la lunghezza del log
        run: |
          if [ -f risultati/netex_monitor.log ]; then
            tail -n 3000 risultati/netex_monitor.log > "$RUNNER_TEMP/log" && mv "$RUNNER_TEMP/log" risultati/netex_monitor.log
          fi

      - name: Salva i risultati nel repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add risultati interno baseline.json
          if git diff --cached --quiet; then
            echo "Nessuna modifica da salvare"
          else
            git commit -m "Controllo NeTEx $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Esito
        if: steps.check.outcome == 'failure'
        run: |
          echo "::error::Il controllo ha segnalato un errore: vedi risultati/last_run.json e il log del passo precedente"
          exit 1
